server {
    listen 80;
    server_name localhost;

    # Root directory for files being served
    root /var/www/html;

    charset utf-8;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Serve theme assets directly with caching
    location ^~ /.theme/ {
        alias /var/www/theme/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Autoindex directory listing configuration
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Inject theme header and footer
        add_before_body /.theme/header.html;
        add_after_body /.theme/footer.html;
    }

    # Hide hidden files (dotfiles) except .theme
    location ~ /\.(?!theme) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
